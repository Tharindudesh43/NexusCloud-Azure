<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Cloud</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      :root {
        --bg: #020617;
        --sidebar-bg: #0f172a;
        --accent: #10b981; /* Emerald Green */
        --accent-glow: rgba(16, 185, 129, 0.3);
        --text-main: #f8fafc;
        --text-dim: #64748b;
        --danger: #f43f5e;
        --card-glass: rgba(30, 41, 59, 0.5);
        --border: rgba(255, 255, 255, 0.08);
      }

      body {
        margin: 0;
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: var(--bg);
        background-image:
          radial-gradient(
            circle at 0% 0%,
            rgba(16, 185, 129, 0.15) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 100% 100%,
            rgba(56, 189, 248, 0.1) 0%,
            transparent 40%
          );
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 20px;
      }

      .dashboard {
        width: 100%;
        max-width: 1400px;
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 25px;
      }

      .sidebar {
        background: var(--sidebar-bg);
        border-right: 1px solid var(--border);
        border-radius: 30px;
        padding: 30px;
        height: fit-content;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }

      .brand {
        font-size: 1.8rem;
        font-weight: 900;
        letter-spacing: -1px;
        color: var(--text-main);
        margin-bottom: 40px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand span {
        color: var(--accent);
      }

      .feature-tag {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 12px;
        margin-bottom: 10px;
        font-size: 0.85rem;
        border: 1px solid transparent;
        transition: 0.3s;
      }
      .feature-tag:hover {
        border-color: var(--accent);
        background: rgba(16, 185, 129, 0.05);
      }
      .feature-tag i {
        color: var(--accent);
      }

      .storage-card {
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        padding: 20px;
        border-radius: 20px;
        margin: 20px 0;
        border: 1px solid var(--border);
      }

      .storage-bar {
        height: 8px;
        background: #334155;
        border-radius: 10px;
        margin: 12px 0;
        overflow: hidden;
      }
      .storage-fill {
        background: linear-gradient(90deg, var(--accent), #34d399);
        box-shadow: 0 0 15px var(--accent-glow);
        transition: width 1s ease-in-out;
      }

      .upload-zone {
        border: 2px dashed #334155;
        border-radius: 20px;
        padding: 30px;
        text-align: center;
        transition: 0.3s;
        background: rgba(255, 255, 255, 0.02);
      }
      .upload-zone:hover {
        border-color: var(--accent);
        background: rgba(16, 185, 129, 0.05);
        transform: translateY(-2px);
      }

      .main-panel {
        background: var(--card-glass);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        border-radius: 30px;
        padding: 40px;
      }

      .header-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }

      .search-input {
        background: #0f172a;
        border: 1px solid var(--border);
        padding: 14px 20px 14px 50px;
        border-radius: 15px;
        color: white;
        width: 300px;
        transition: 0.3s;
      }
      .search-input:focus {
        width: 400px;
        border-color: var(--accent);
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
      }

      .file-header {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 120px;
        padding: 15px 25px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 12px;
        font-weight: bold;
        font-size: 0.75rem;
        letter-spacing: 1.5px;
        color: var(--text-dim);
        margin-bottom: 15px;
      }

      .file-row {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 120px;
        align-items: center;
        padding: 18px 25px;
        border-radius: 18px;
        margin-bottom: 10px;
        background: rgba(15, 23, 42, 0.4);
        border: 1px solid transparent;
        transition: 0.3s;
      }
      .file-row:hover {
        transform: scale(1.01);
        background: rgba(30, 41, 59, 0.8);
        border-color: var(--accent);
      }

      .btn-action {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.2s;
        color: white;
        text-decoration: none;
      }
      .btn-view {
        background: rgba(16, 185, 129, 0.1);
        color: var(--accent);
      }
      .btn-view:hover {
        background: var(--accent);
        color: white;
      }
      .btn-del {
        background: rgba(244, 63, 94, 0.1);
        color: var(--danger);
      }
      .btn-del:hover {
        background: var(--danger);
        color: white;
      }

      .upload-btn {
        background: var(--accent);
        color: #020617;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        box-shadow: 0 10px 20px var(--accent-glow);
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(2, 6, 23, 0.9);
        backdrop-filter: blur(10px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .modal {
        background: #1e293b;
        padding: 40px;
        border-radius: 24px;
        border: 1px solid var(--accent);
        max-width: 400px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="brand">
          <i class="fa-solid fa-shuttle-space"></i> NEXUS<span>CLOUD</span>
        </div>

        <div class="feature-tag">
          <i class="fa-solid fa-server"></i> Azure Ubuntu VM
        </div>
        <div class="feature-tag">
          <i class="fa-solid fa-code"></i> REST API Backend
        </div>
        <div class="feature-tag">
          <i class="fa-solid fa-shield-halved"></i> SAS Security Layer
        </div>
        <div class="feature-tag">
          <i class="fa-solid fa-bolt"></i> Apache Web Server
        </div>

        <div class="storage-card">
          <div
            style="
              display: flex;
              justify-content: space-between;
              font-size: 0.75rem;
            "
          >
            <span>STORAGE USAGE</span>
            <span id="storageText">0MB / 50MB</span>
          </div>
          <div class="storage-bar">
            <div class="storage-fill" id="storageBar" style="width: 0%"></div>
          </div>
        </div>

        <div
          class="upload-zone"
          onclick="document.getElementById('fileInput').click()"
        >
          <i
            class="fa-solid fa-cloud-arrow-up"
            style="font-size: 2.5rem; color: var(--accent)"
          ></i>
          <p style="margin-top: 15px; font-weight: bold">Drop files here</p>
          <p style="font-size: 0.75rem; color: var(--text-dim)">
            Max payload: 50MB
          </p>
        </div>

        <input
          type="file"
          id="fileInput"
          hidden
          onchange="selectFile(this.files[0])"
        />

        <div
          id="filePreview"
          style="
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            font-size: 0.8rem;
          "
        >
          <i
            class="fa-solid fa-file-signature"
            style="color: var(--accent)"
          ></i>
          <span id="selectedName"></span>
          <button
            id="uploadBtn"
            class="upload-btn"
            onclick="startUpload()"
            style="
              display: block;
              width: 100%;
              margin-top: 15px;
              padding: 12px;
              border-radius: 10px;
              border: none;
              cursor: pointer;
            "
          >
            PUSH TO CLOUD
          </button>
        </div>
      </aside>

      <main class="main-panel">
        <div class="header-actions">
          <h2 style="margin: 0; font-size: 1.5rem">Global File System</h2>
          <div style="display: flex; gap: 15px">
            <div style="position: relative">
              <i
                class="fa-solid fa-search"
                style="
                  position: absolute;
                  left: 18px;
                  top: 16px;
                  color: var(--text-dim);
                "
              ></i>
              <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="Filter vault..."
                onkeyup="filterFiles()"
              />
            </div>
            <button
              class="btn-action btn-view"
              onclick="loadFiles()"
              style="width: 50px; height: 50px; border-radius: 15px"
            >
              <i class="fa-solid fa-rotate"></i>
            </button>
          </div>
        </div>

        <div class="file-header">
          <span>ASSET NAME</span>
          <span>CAPACITY</span>
          <span>TIMESTAMP</span>
          <span style="text-align: right">CONTROL</span>
        </div>

        <div class="file-list" id="fileContainer"></div>
      </main>
    </div>

    <div class="modal-overlay" id="deleteModal">
      <div class="modal">
        <i
          class="fa-solid fa-triangle-exclamation"
          style="font-size: 3rem; color: var(--danger); margin-bottom: 20px"
        ></i>
        <h3 style="margin: 0 0 10px 0">Wipe Asset?</h3>
        <p style="color: var(--text-dim); font-size: 0.9rem">
          This will permanently remove the data from the Azure Blob cluster.
        </p>
        <div style="display: flex; gap: 10px; margin-top: 30px">
          <button
            onclick="closeModal()"
            style="
              flex: 1;
              padding: 12px;
              border-radius: 10px;
              border: none;
              background: #334155;
              color: white;
              cursor: pointer;
            "
          >
            Cancel
          </button>
          <button
            id="confirmDelBtn"
            style="
              flex: 1;
              padding: 12px;
              border-radius: 10px;
              border: none;
              background: var(--danger);
              color: white;
              cursor: pointer;
              font-weight: bold;
            "
          >
            Confirm Wipe
          </button>
        </div>
      </div>
    </div>

    <script>
      const accountName = "storagewebsitetdh";
      const containerName = "newcontainerforwebsite";
      const containerUrl = `https://${accountName}.blob.core.windows.net/${containerName}`;
      const sasToken =
        "sv=2025-11-05&ss=bfqt&srt=sco&sp=rwdlacupiytfx&se=2026-04-30T04:03:33Z&st=2026-04-29T19:48:33Z&spr=https,http&sig=NeQuA51z0j%2FZP%2BN88EmbxSBRkQQz%2Bys%2FAz0%2FCKMI0w8%3D";
      const getSas = () =>
        sasToken.startsWith("?") ? sasToken : `?${sasToken}`;

      let selectedFile = null;
      let pendingDelete = null;

      function selectFile(file) {
        if (!file) return;
        selectedFile = file;
        document.getElementById("selectedName").innerText = file.name;
        document.getElementById("filePreview").style.display = "block";
      }

      function startUpload() {
        const url = `${containerUrl}/${encodeURIComponent(selectedFile.name)}${getSas()}`;
        const xhr = new XMLHttpRequest();
        xhr.open("PUT", url, true);
        xhr.setRequestHeader("x-ms-blob-type", "BlockBlob");

        const btn = document.getElementById("uploadBtn");
        btn.innerText = "UPLOADING...";
        btn.disabled = true;

        xhr.onload = () => {
          btn.innerText = "PUSH TO CLOUD";
          btn.disabled = false;
          document.getElementById("filePreview").style.display = "none";
          loadFiles();
        };
        xhr.send(selectedFile);
      }

      async function loadFiles() {
        const container = document.getElementById("fileContainer");
        container.innerHTML =
          '<div style="text-align:center; padding: 50px; color: var(--text-dim);"><i class="fa-solid fa-spinner fa-spin"></i> Synchronizing...</div>';

        try {
          const res = await fetch(
            `${containerUrl}${getSas()}&restype=container&comp=list`,
          );
          const xml = new DOMParser().parseFromString(
            await res.text(),
            "text/xml",
          );
          const blobs = xml.getElementsByTagName("Blob");
          container.innerHTML = "";
          let totalSize = 0;

          for (let b of blobs) {
            let name = b.getElementsByTagName("Name")[0].textContent;
            let size = parseInt(
              b.getElementsByTagName("Content-Length")[0].textContent,
            );
            let date = new Date(
              b.getElementsByTagName("Last-Modified")[0].textContent,
            ).toLocaleDateString();
            totalSize += size;

            container.innerHTML += `
                        <div class="file-row" data-name="${name.toLowerCase()}">
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <i class="fa-solid fa-file-code" style="color: var(--accent); font-size: 1.2rem;"></i>
                                <span style="font-weight: 600;">${name}</span>
                            </div>
                            <div style="color: var(--text-dim); font-size: 0.85rem;">${(size / 1024).toFixed(1)} KB</div>
                            <div style="color: var(--text-dim); font-size: 0.85rem;">${date}</div>
                            <div style="display: flex; gap: 8px; justify-content: flex-end;">
                                <a href="${containerUrl}/${encodeURIComponent(name)}${getSas()}" target="_blank" class="btn-action btn-view"><i class="fa-solid fa-eye"></i></a>
                                <button onclick="askDelete('${name}')" class="btn-action btn-del"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>`;
          }
          updateStorage(totalSize);
        } catch (e) {
          container.innerHTML =
            '<div style="color:var(--danger); padding: 20px;">Cluster error. Check Azure CORS.</div>';
        }
      }

      function updateStorage(used) {
        const limit = 52428800;
        const percent = (used / limit) * 100;
        document.getElementById("storageBar").style.width =
          Math.min(percent, 100) + "%";
        document.getElementById("storageText").innerText =
          `${(used / 1024 / 1024).toFixed(1)}MB / 50MB`;
      }

      function filterFiles() {
        const query = document
          .getElementById("searchInput")
          .value.toLowerCase();
        document.querySelectorAll(".file-row").forEach((row) => {
          row.style.display = row.getAttribute("data-name").includes(query)
            ? "grid"
            : "none";
        });
      }

      function askDelete(name) {
        pendingDelete = name;
        document.getElementById("deleteModal").style.display = "flex";
        document.getElementById("confirmDelBtn").onclick = confirmDelete;
      }

      function closeModal() {
        document.getElementById("deleteModal").style.display = "none";
      }

      async function confirmDelete() {
        await fetch(
          `${containerUrl}/${encodeURIComponent(pendingDelete)}${getSas()}`,
          { method: "DELETE" },
        );
        closeModal();
        loadFiles();
      }

      loadFiles();
    </script>
  </body>
</html>
