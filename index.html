<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Cloud | Professional Vault</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      :root {
        --bg: #0f172a;
        --card-bg: rgba(30, 41, 59, 0.7);
        --accent: #38bdf8;
        --accent-glow: rgba(56, 189, 248, 0.3);
        --text-main: #f1f5f9;
        --text-dim: #94a3b8;
        --danger: #ef4444;
        --success: #22c55e;
        --border: rgba(255, 255, 255, 0.1);
      }

      body {
        margin: 0;
        font-family: "Inter", system-ui, sans-serif;
        background-color: var(--bg);
        background-image: radial-gradient(
          at 0% 0%,
          rgba(56, 189, 248, 0.1) 0px,
          transparent 50%
        );
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 20px;
      }

      .dashboard {
        width: 100%;
        max-width: 1200px;
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 20px;
      }

      .sidebar {
        background: var(--card-bg);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 25px;
        height: fit-content;
        position: sticky;
        top: 20px;
      }

      .brand {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--accent);
        margin-bottom: 30px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .storage-card {
        background: rgba(15, 23, 42, 0.5);
        padding: 15px;
        border-radius: 16px;
        margin-bottom: 25px;
        border: 1px solid var(--border);
      }
      .storage-bar {
        height: 6px;
        background: #334155;
        border-radius: 10px;
        margin: 10px 0;
        overflow: hidden;
      }
      .storage-fill {
        width: 45%;
        height: 100%;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
      }

      .upload-zone {
        border: 2px dashed var(--border);
        border-radius: 16px;
        padding: 20px;
        text-align: center;
        cursor: pointer;
        transition: 0.3s;
      }
      .upload-zone:hover {
        border-color: var(--accent);
        background: rgba(56, 189, 248, 0.05);
      }

      .main-panel {
        background: var(--card-bg);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 30px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .controls {
        display: flex;
        gap: 15px;
        align-items: center;
      }
      .search-wrapper {
        flex: 1;
        position: relative;
      }
      .search-wrapper i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-dim);
      }
      .search-input {
        width: 100%;
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid var(--border);
        padding: 12px 12px 12px 45px;
        border-radius: 12px;
        color: white;
        outline: none;
      }
      .search-input:focus {
        border-color: var(--accent);
      }

      .file-header {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 100px;
        padding: 0 20px;
        color: var(--text-dim);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .file-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .file-row {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 100px;
        align-items: center;
        background: rgba(15, 23, 42, 0.3);
        padding: 15px 20px;
        border-radius: 16px;
        border: 1px solid transparent;
        transition: 0.2s;
      }
      .file-row:hover {
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.02);
      }

      .file-main {
        display: flex;
        align-items: center;
        gap: 15px;
        font-weight: 500;
      }
      .file-icon {
        color: var(--accent);
        font-size: 1.2rem;
      }
      .file-meta {
        font-size: 0.9rem;
        color: var(--text-dim);
      }

      .btn-group {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      .icon-btn {
        background: rgba(255, 255, 255, 0.05);
        border: none;
        color: white;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
      }
      .icon-btn.del:hover {
        background: var(--danger);
      }
      .icon-btn.view:hover {
        background: var(--accent);
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(5px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 100;
      }
      .modal {
        background: #1e293b;
        padding: 30px;
        border-radius: 20px;
        text-align: center;
        max-width: 400px;
        border: 1px solid var(--border);
      }
      .modal-btns {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      .m-btn {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-weight: bold;
      }

      .upload-btn {
        background: var(--accent);
        color: var(--bg);
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        margin-top: 15px;
        cursor: pointer;
        border: none;
        font-weight: bold;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="brand"><i class="fa-solid fa-cloud-bolt"></i> NEXUS</div>

        <div class="storage-card">
          <div
            style="
              display: flex;
              justify-content: space-between;
              font-size: 0.8rem;
            "
          >
            <span>Cloud Storage</span>
            <span id="storageText">Loading...</span>
          </div>
          <div class="storage-bar">
            <div class="storage-fill" id="storageBar"></div>
          </div>
        </div>

        <div
          class="upload-zone"
          onclick="document.getElementById('fileInput').click()"
        >
          <i class="fa-solid fa-file-arrow-up"></i>
          <p style="font-size: 0.9rem; margin: 10px 0 0">Choose File</p>
        </div>
        <input
          type="file"
          id="fileInput"
          hidden
          onchange="selectFile(this.files[0])"
        />

        <div
          id="filePreview"
          style="
            display: none;
            margin-top: 15px;
            font-size: 0.8rem;
            text-align: center;
          "
        >
          <i class="fa-solid fa-paperclip"></i> <span id="selectedName"></span>
        </div>
        <button id="uploadBtn" class="upload-btn" onclick="startUpload()">
          Confirm Upload
        </button>
      </aside>

      <main class="main-panel">
        <div class="controls">
          <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              type="text"
              class="search-input"
              id="searchInput"
              placeholder="Search your vault..."
              onkeyup="filterFiles()"
            />
          </div>
          <button class="icon-btn" onclick="loadFiles()">
            <i class="fa-solid fa-rotate"></i>
          </button>
        </div>

        <div class="file-header">
          <span>Name</span>
          <span>Size</span>
          <span>Modified</span>
          <span style="text-align: right">Actions</span>
        </div>

        <div class="file-list" id="fileContainer"></div>
      </main>
    </div>

    <div class="modal-overlay" id="deleteModal">
      <div class="modal">
        <i
          class="fa-solid fa-circle-exclamation"
          style="font-size: 3rem; color: var(--danger)"
        ></i>
        <h3>Confirm Delete</h3>
        <p>Are you sure? This action is permanent.</p>
        <div class="modal-btns">
          <button
            class="m-btn"
            style="background: #334155; color: white"
            onclick="closeModal()"
          >
            Cancel
          </button>
          <button
            class="m-btn"
            style="background: var(--danger); color: white"
            id="confirmDelBtn"
          >
            Delete Now
          </button>
        </div>
      </div>
    </div>

    <script>
      const accountName = "storagewebsitetdh";
      const containerName = "newcontainerforwebsite";
      const containerUrl = `https://${accountName}.blob.core.windows.net/${containerName}`;
      const sasToken =
        "sv=2025-11-05&ss=bfqt&srt=sco&sp=rwdlacupiytfx&se=2026-04-30T04:03:33Z&st=2026-04-29T19:48:33Z&spr=https,http&sig=NeQuA51z0j%2FZP%2BN88EmbxSBRkQQz%2Bys%2FAz0%2FCKMI0w8%3D";
      const getSas = () =>
        sasToken.startsWith("?") ? sasToken : `?${sasToken}`;

      let selectedFile = null;
      let pendingDelete = null;

      function selectFile(file) {
        if (!file) return;
        selectedFile = file;
        document.getElementById("selectedName").innerText = file.name;
        document.getElementById("filePreview").style.display = "block";
        document.getElementById("uploadBtn").style.display = "block";
      }

      function startUpload() {
        const url = `${containerUrl}/${encodeURIComponent(selectedFile.name)}${getSas()}`;
        const xhr = new XMLHttpRequest();
        xhr.open("PUT", url, true);
        xhr.setRequestHeader("x-ms-blob-type", "BlockBlob");

        document.getElementById("uploadBtn").innerText = "Uploading...";
        xhr.onload = () => {
          document.getElementById("uploadBtn").style.display = "none";
          document.getElementById("filePreview").style.display = "none";
          loadFiles();
        };
        xhr.send(selectedFile);
      }

      async function loadFiles() {
        const res = await fetch(
          `${containerUrl}${getSas()}&restype=container&comp=list`,
        );
        const xml = new DOMParser().parseFromString(
          await res.text(),
          "text/xml",
        );
        const blobs = xml.getElementsByTagName("Blob");
        const container = document.getElementById("fileContainer");

        container.innerHTML = "";
        let totalSize = 0;

        for (let b of blobs) {
          let name = b.getElementsByTagName("Name")[0].textContent;
          let size = parseInt(
            b.getElementsByTagName("Content-Length")[0].textContent,
          );
          let date = new Date(
            b.getElementsByTagName("Last-Modified")[0].textContent,
          ).toLocaleDateString();
          totalSize += size;

          container.innerHTML += `
                <div class="file-row" data-name="${name.toLowerCase()}">
                    <div class="file-main">
                        <i class="fa-solid fa-file file-icon"></i>
                        <span>${name}</span>
                    </div>
                    <div class="file-meta">${(size / 1024).toFixed(1)} KB</div>
                    <div class="file-meta">${date}</div>
                    <div class="btn-group">
                        <a href="${containerUrl}/${encodeURIComponent(name)}${getSas()}" target="_blank" class="icon-btn view" style="display:flex; align-items:center; justify-content:center; text-decoration:none;">
                            <i class="fa-solid fa-eye"></i>
                        </a>
                        <button onclick="askDelete('${name}')" class="icon-btn del"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>`;
        }
        updateStorage(totalSize);
      }

      function updateStorage(used) {
        const limit = 52428800;
        const percent = (used / limit) * 100;
        document.getElementById("storageBar").style.width = percent + "%";
        document.getElementById("storageText").innerText =
          `${(used / 1024 / 1024).toFixed(1)}MB / 50MB`;
      }

      function filterFiles() {
        const query = document
          .getElementById("searchInput")
          .value.toLowerCase();
        document.querySelectorAll(".file-row").forEach((row) => {
          row.style.display = row.getAttribute("data-name").includes(query)
            ? "grid"
            : "none";
        });
      }

      function askDelete(name) {
        pendingDelete = name;
        document.getElementById("deleteModal").style.display = "flex";
        document.getElementById("confirmDelBtn").onclick = confirmDelete;
      }

      function closeModal() {
        document.getElementById("deleteModal").style.display = "none";
      }

      async function confirmDelete() {
        await fetch(
          `${containerUrl}/${encodeURIComponent(pendingDelete)}${getSas()}`,
          { method: "DELETE" },
        );
        closeModal();
        loadFiles();
      }

      loadFiles();
    </script>
  </body>
</html>
